<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="icon" href="./round-robin-logo.png" type="image/png">
<link rel="stylesheet" href="./app.css?v=0.2">
<title>RR Regatta</title>
</head>
<body>
<div class="app">
  <header class="testata">
    <img src="./round-robin-logo.png" alt="Logo Round Robin">
    <div class="titolo"><strong>RR Regatta</strong><small id="versione">versione 0.2</small></div>
    <div class="stato-gps" id="stato-gps" role="status" aria-live="polite"><i></i><span id="stato-gps-testo">GPS fermo</span></div>
  </header>

  <section class="strumenti" aria-label="Strumenti di navigazione">
    <div class="strumento" id="cella-cog">
      <span class="etichetta">ROTTA <small>COG</small></span>
      <output class="valore" id="cog">—</output>
      <span class="nota" id="nota-cog">GPS fermo</span>
    </div>
    <div class="strumento" id="cella-sog">
      <span class="etichetta">VELOCITÀ <small>SOG</small></span>
      <output class="valore"><span id="sog">—</span><small> kn</small></output>
      <span class="nota" id="nota-sog">GPS fermo</span>
    </div>
  </section>

  <section class="mappa" id="mappa" aria-label="Mappa della posizione, nord in alto">
    <svg id="carta" role="img" aria-label="Posizione della barca"></svg>
    <div class="mappa-messaggio" id="mappa-messaggio">
      <strong id="messaggio-titolo">Premi «Avvia GPS»</strong>
      <span id="messaggio-testo">La posizione della barca comparirà qui.</span>
    </div>
    <div class="riquadro-pos" id="riquadro-pos" hidden>
      <span id="lat">—</span><span id="lon">—</span><small id="precisione">—</small>
    </div>
    <div class="comandi-mappa">
      <button type="button" id="zoom-piu" aria-label="Ingrandisci">+</button>
      <button type="button" id="zoom-meno" aria-label="Riduci">−</button>
      <button type="button" id="segui" class="testo" aria-label="Centra sulla barca e seguila">Barca</button>
    </div>
  </section>

  <footer class="barra">
    <button type="button" class="principale" id="btn-gps">Avvia GPS</button>
    <div class="opzioni">
      <button type="button" class="interruttore" id="btn-schermo" aria-pressed="false">Schermo acceso: no</button>
      <button type="button" class="interruttore" id="btn-traccia" aria-pressed="false">Traccia: no</button>
      <a class="collegamento" href="./diagnostica/">Diagnostica</a>
    </div>
  </footer>
</div>
<div class="avviso-errore" id="avviso-errore" hidden></div>
<script type="module" src="./js/app.mjs?v=0.2"></script>
</body>
</html>
